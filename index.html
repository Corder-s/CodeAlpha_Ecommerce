<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSphere</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <h1>ShopSphere</h1>

  <input type="text" id="search" placeholder="Search products">

  <div class="cart-box">
    Cart: <span id="cart-count">0</span>
  </div>
</nav>

<header>
  <h2>Modern Ecommerce Store</h2>
  <p>Professional Internship Project</p>
</header>

<section class="buttons">
  <button onclick="filterProducts('All')">All</button>
  <button onclick="filterProducts('Shoes')">Shoes</button>
  <button onclick="filterProducts('Electronics')">Electronics</button>
  <button onclick="filterProducts('Fashion')">Fashion</button>
</section>

<section class="products" id="products"></section>

<div class="cart-section">
  <h2>Shopping Cart</h2>
  <div id="cart-items"></div>
  <h3>Total: $<span id="total">0</span></h3>
</div>

<footer>
  <p>© 2026 ShopSphere Ecommerce Website</p>
</footer>

<script src="script.js"></script>

</body>
</html>
